[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-subnet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "bittensor==9.12.2",
  "bittensor-wallet==4.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
instant-validator = "instant_validator.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
