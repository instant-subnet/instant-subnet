[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-subnet"
version = "0.1.0"
description = "The minimal Finney validator service for Instant subnet 46"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1.0",
  # The direct weight extrinsic is tested against this exact SDK surface.
  "bittensor==9.12.2",
  # Bittensor 9 imports scalecodec; async-substrate-interface 2.x conflicts with it.
  "async-substrate-interface>=1.5.6,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
instant-validator = "instant_validator.service:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["instant_validator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "default::DeprecationWarning:bittensor",
  "default::DeprecationWarning:substrateinterface",
  "default::DeprecationWarning:async_substrate_interface",
]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
