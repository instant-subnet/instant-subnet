# Target SLOs (DESIGN.md §2.4).
#
# These are the numbers scoring is calibrated against, not marketing
# promises. They live here, versioned, so that tightening them is a visible
# commit rather than a silent validator tweak -- and so a miner can read the
# same file the validator scores it with.
#
# Everything compared across validators in this repo is an integer. Durations
# are milliseconds, ratios are basis points (10000 = 100%). See
# instant/protocol/canonical.py for the full argument; the short version is
# that two validators must compute byte-identical weights from identical
# observations, and floating point is the easiest way to make that untrue.
#
# The scoring weights that consume these targets are one file over, in
# config/scoring.toml, matching the layout in DESIGN.md §10.1.

[version]
# Bumped on any change below. Validators log it at startup and the platform
# surfaces it, so a mismatch between validators is visible within one epoch
# rather than discovered later as consensus drift.
id = 1

[latency]
# TTFT p95 at the miner, excluding the platform hop. This is the number the
# subnet is named after.
ttft_p95_target_ms = 250

[throughput]
# Sustained tokens/sec on a single stream, p50.
tokens_per_s_p50_target = 100

[availability]
# Across all probe sources over one epoch.
success_rate_min_bps = 9900

[attestation]
# A bundle older than this is not an attestation, it is a memory. Sixty
# minutes is short enough that a miner cannot swap hardware behind a stale
# proof, and long enough that re-attesting is not itself a load source.
max_age_ms = 3600000
